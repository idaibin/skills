interface:
  display_name: "Ops Client"
  short_description: "Operate desktop clients and app sessions"
  default_prompt: "Use $ops-client to verify a desktop client within existing task authority. Bind the executable, process/window or app-owned protocol/session. Keep semantic state and visible-window proof separate, verify postconditions, and preserve foreground and screen-session constraints. Use ops-device for physical phones, emulators, and simulators; a desktop client's WebView remains client-owned."
