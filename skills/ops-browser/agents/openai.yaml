interface:
  display_name: "Ops Browser"
  short_description: "Operate browser surfaces with verified computed evidence"
  default_prompt: "Use $ops-browser to prefer the configured user local browser and safely reuse its existing session, workspace, and matching open page unless the request fixes another surface. When locked, use only a preconnected browser-native control plane with proven background-safe capability; never use GUI input. Verify identity, target, authorization, and final postcondition, with unsupported claims marked Not verified."
