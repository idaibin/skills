name: Temporary dev-typescript full gate

on:
  push:
    branches:
      - validation/dev-typescript-full-gate-20260820

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@v4
        with:
          ref: 5ec0b5705f6dc973cd61bd50484f330d3f81a351
          fetch-depth: 0

      - name: Verify immutable basis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5ec0b5705f6dc973cd61bd50484f330d3f81a351"
          git cat-file -e "f34ff9143024f9337cd6fe5cb90ce48f25d76c16^{commit}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install Python validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run canonical Skills gate
        shell: bash
        env:
          PYTHON_BIN: python3
          SKILLS_BASE_SHA: f34ff9143024f9337cd6fe5cb90ce48f25d76c16
        run: |
          set -euo pipefail
          set -o pipefail
          bash scripts/check-skills.sh 2>&1 | tee skills-full-gate.log
          git show --check --format= HEAD
          git diff --exit-code

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-typescript-full-gate-log
          path: skills-full-gate.log
          if-no-files-found: ignore
          retention-days: 14
