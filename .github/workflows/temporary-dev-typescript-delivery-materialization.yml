name: Temporary dev-typescript delivery materialization

on:
  push:
    branches:
      - validation/dev-typescript-integration-review-20260820
    paths:
      - .github/workflows/temporary-dev-typescript-delivery-materialization.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/dev-typescript-integration-review-20260820
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Materialize exact merge commit and rerun canonical gate
        id: delivery
        shell: bash
        env:
          MAIN_SHA: f371e0933684205376f0e1818e833a2a58eea486
          CANDIDATE_SHA: 463b8000afed61650fe242aa59758ca7f7460430
          EXPECTED_TREE: 17564de5ba561f9da2f2001042b3e4b3850e1844
          DELIVERY_BRANCH: validation/dev-typescript-delivery-candidate-20260820
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/dev-typescript-delivery"
          result_dir="$GITHUB_WORKSPACE/.validation/delivery-materialization"
          log="$result_dir/dev-typescript-delivery-materialization.log"
          result="$result_dir/dev-typescript-delivery-materialization.json"
          mkdir -p "$result_dir"
          : > "$log"

          git cat-file -e "$MAIN_SHA^{commit}"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/codex/dev-typescript)" = "$CANDIDATE_SHA"
          git worktree add --detach "$worktree" "$MAIN_SHA"

          overall=0
          run_check() {
            local label="$1"
            shift
            printf '\n## %s\n$' "$label" >> "$log"
            printf ' %q' "$@" >> "$log"
            printf '\n' >> "$log"
            set +e
            "$@" >> "$log" 2>&1
            local code=$?
            set -e
            printf 'exit_code=%s\n' "$code" >> "$log"
            if [[ "$code" -ne 0 ]]; then overall=1; fi
            return "$code"
          }

          pushd "$worktree" >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "main_sha=$MAIN_SHA"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "expected_tree=$EXPECTED_TREE"
            echo "runner_os=$RUNNER_OS"
            echo "git=$(git --version)"
            echo "python=$(python3 --version 2>&1)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } >> "$log"

          run_check create_merge_commit git merge --no-ff -m "merge(skills): integrate dev-typescript capability" "$CANDIDATE_SHA"
          merge_commit="$(git rev-parse HEAD)"
          merge_tree="$(git rev-parse HEAD^{tree})"
          parent_line="$(git rev-list --parents -n 1 HEAD)"
          printf 'merge_commit=%s\nmerge_tree=%s\nparents=%s\n' "$merge_commit" "$merge_tree" "$parent_line" >> "$log"
          test "$merge_tree" = "$EXPECTED_TREE"
          test "$parent_line" = "$merge_commit $MAIN_SHA $CANDIDATE_SHA"

          export PYTHON_BIN=python3
          export SKILLS_BASE_SHA="$MAIN_SHA"
          run_check canonical_full_gate bash scripts/check-skills.sh
          run_check committed_merge_check git show --check --format= HEAD
          run_check clean_worktree bash -c 'test -z "$(git status --porcelain)"'
          run_check publish_delivery_candidate git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          popd >/dev/null

          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          log_sha256="$(sha256sum "$log" | awk '{print $1}')"
          export merge_commit merge_tree parent_line generated_at log_sha256 overall
          python3 - "$result" <<'PY'
          import json
          import os
          import sys

          payload = {
              "schema_version": "ai-engineering-lab/delivery-materialization/v1",
              "repository": "idaibin/skills",
              "main_commit": os.environ["MAIN_SHA"],
              "candidate_commit": os.environ["CANDIDATE_SHA"],
              "delivery_branch": os.environ["DELIVERY_BRANCH"],
              "delivery_commit": os.environ["merge_commit"],
              "delivery_tree": os.environ["merge_tree"],
              "expected_tree": os.environ["EXPECTED_TREE"],
              "parents": os.environ["parent_line"].split()[1:],
              "canonical_gate": "pass" if os.environ["overall"] == "0" else "fail",
              "status": "pass" if os.environ["overall"] == "0" else "fail",
              "generated_at_utc": os.environ["generated_at"],
              "log_path": ".validation/delivery-materialization/dev-typescript-delivery-materialization.log",
              "log_sha256": os.environ["log_sha256"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

          git worktree remove --force "$worktree"
          echo "delivery_status=$overall" >> "$GITHUB_OUTPUT"

      - name: Persist delivery materialization evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .validation/delivery-materialization/dev-typescript-delivery-materialization.json \
            .validation/delivery-materialization/dev-typescript-delivery-materialization.log
          git commit -m "test(delivery): record dev-typescript merge materialization [skip ci]"
          git push origin HEAD:validation/dev-typescript-integration-review-20260820

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-typescript-delivery-materialization-evidence
          path: .validation/delivery-materialization/*
          if-no-files-found: error
          retention-days: 14

      - name: Enforce delivery candidate
        if: always()
        shell: bash
        run: test "${{ steps.delivery.outputs.delivery_status }}" = "0"
